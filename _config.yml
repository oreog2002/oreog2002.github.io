# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Oreoluwa Ogunleye
description: "Hello! I'm Ore, and I’m currently building out a portfolio of exciting projects across Data Science & AI.  My projects focus on practical, value-adding solutions with a strong emphasis on real-world impact and sports. Please visit my GitHub & LinkedIn pages (or download my Resume) by using the links below!"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Data Science <span style="color:#f58506"> Portfolio </span>
location: "Omaha, NE, USA"
resume_url: /docs/Overall-Data-Scientist-Resume.pdf
avatar_image: /img/Oreoulwa_Ogunleye_profile_pic.jpg

#-------------------------------
# Contact links
linkedln: "https://www.linkedin.com/in/oreoluwa-ogunleye/#" # Add your linkedln handle
github: "https://github.com/oreog2002/oreog2002.github.io/tree/master/#"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


